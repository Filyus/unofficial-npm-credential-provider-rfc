# Checks the links between the documents and runs the Phase 2 conformance
# material: the generated files are fresh relative to spec/policy-v1.json,
# the Python model's tests (every policy value, the provider chain and the
# example transcripts included) pass, the reference providers produce
# their examples' transcripts on synthetic time and, on each OS, on real
# time, and the Rust client and provider pair
# builds, lints clean and passes its tests; and the Verdaccio provider runs against a
# real Verdaccio, not only against its fake.
name: conformance

on:
  push:
    paths:
      - 'spec/**'
      - 'tests/**'
      - 'tools/**'
      - 'poc/rust/**'
      - '**.md'
      - 'examples/**'
      - 'refs.json'
      - '.github/workflows/conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    env:
      # a test that needs node, cargo or jsonschema fails where it is missing, and does not skip
      REQUIRE_TOOLS: '1'
    steps:
      - uses: actions/checkout@v7
      - name: links between the documents resolve
        run: node tools/check-links.js
      - name: generated files are fresh
        run: python3 tools/generate_from_policy.py --check
      - name: the tools the tests need are there, so that no check skips
        run: |
          python3 -c "import jsonschema"
          node --version
          cargo --version
      - name: python model
        run: python3 -m unittest discover -v
      - name: reference providers produce their transcripts
        run: node examples/providers/run.js
      - name: rust
        working-directory: poc/rust
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  # A conformance run makes time synthetic; this runs the reference
  # providers on the system clock and real timers instead, on each OS, since
  # how a provider reaches the terminal differs on Windows.
  real-time:
    name: reference providers on real time, ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: node --test examples/providers/real-time.test.js examples/providers/protocol.test.js

  # The Verdaccio reference provider against a real Verdaccio server, installed from npm
  # and run as a Node process, so that a place where the hand-written fake disagrees with
  # the real thing (a method, a status, a header, the keys of a body) fails here and not
  # in the field. 6.10.6 is the current stable release; 7.0.0-next-7.31 is the pre-release of
  # the 7.x line, which has staging and 2FA behind flags. Divergences that are known are in
  # examples/providers/live/verdaccio-divergences.json, with a reason each; the scenarios that
  # cannot run live are in verdaccio-skips.json.
  verdaccio-live:
    name: verdaccio provider against a real server, ${{ matrix.verdaccio }}
    strategy:
      fail-fast: false
      matrix:
        verdaccio: ['6.10.6', '7.0.0-next-7.31']
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: provider against verdaccio ${{ matrix.verdaccio }}
        run: node examples/providers/live/verdaccio.js --version ${{ matrix.verdaccio }}
