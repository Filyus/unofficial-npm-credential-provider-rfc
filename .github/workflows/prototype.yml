# Runs the Phase 1a tokenHelper prototype on macOS, Linux and Windows: the
# patches in poc/patches are applied to npm/cli and npm/npm-registry-fetch at
# the commits they were made on, and then the prototype's own tests, the helper
# output fuzz, the end-to-end check against a local registry and the platform
# probes run on each OS.
name: prototype

on:
  push:
    paths:
      - 'poc/**'
      - 'tests/**'
      - 'spec/**'
      - 'sources.md'
      - 'phase-1a-token-helper.md'
      - 'phase-1b-credential-hardening.md'
      - 'phase-1a-implementation.md'
      - 'phase-1b-implementation.md'
      - 'phase-2-credential-provider.md'
      - 'phase-2-implementation.md'
      - '.github/workflows/prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NPM_CLI_BASE: ae98c62586b6fea44114f72e249e246a2981de70
  NPM_REGISTRY_FETCH_BASE: 6b4159a2519ce5aab26cc4dd8d4596a0b47781d2

jobs:
  prototype:
    name: ${{ matrix.os }}, node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
        # the lowest version of each line npm 12 accepts, and the newest
        node: [22.22.2, 24.15.0, 26.x]
    runs-on: ${{ matrix.os }}
    env:
      # on the newest line a deprecation in the prototype's own code fails the
      # run; set only on the steps that run that code alone
      DEPRECATIONS: ${{ matrix.node == '26.x' && '--throw-deprecation' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      # the patches have LF endings, and lint checks them; npm/cli has test
      # fixtures deeper than the Windows path limit
      - run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v7
        with:
          path: rfc
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: ${{ endsWith(matrix.node, '.x') }}

      - name: Apply the npm-registry-fetch patch
        run: |
          git init -q npm-registry-fetch
          cd npm-registry-fetch
          git fetch -q --depth 1 https://github.com/npm/npm-registry-fetch.git "$NPM_REGISTRY_FETCH_BASE"
          git checkout -q FETCH_HEAD
          git -c user.name=ci -c user.email=ci@localhost am -q ../rfc/poc/patches/npm-registry-fetch.patch
          npm install --ignore-scripts --no-audit --no-fund
      # tests and eslint, without template-oss-check, which compares the repo's
      # git remote and branch with npm's template and has neither here
      - name: Test npm-registry-fetch
        working-directory: npm-registry-fetch
        run: |
          npm test --ignore-scripts
          npm run eslint --ignore-scripts
      - name: npm-registry-fetch seam tests with deprecations as errors
        if: env.DEPRECATIONS != ''
        working-directory: npm-registry-fetch
        run: node $DEPRECATIONS test/auth.js

      # The patch is an mbox of two commits and goes on with `git am`. It raises
      # the npm-registry-fetch floor in package.json to ^20.1.0, which is not
      # published, so the dependencies are installed from the base commit's
      # manifest first and the patch goes on afterwards.
      - name: Apply the npm-cli patch
        run: |
          git init -q npm-cli
          cd npm-cli
          git fetch -q --depth 1 https://github.com/npm/cli.git "$NPM_CLI_BASE"
          git checkout -q FETCH_HEAD
          node scripts/resetdeps.js
          git -c user.name=ci -c user.email=ci@localhost am -q ../rfc/poc/patches/npm-cli.patch
      - name: Test @npmcli/config
        working-directory: npm-cli
        run: node . test --ignore-scripts --workspace @npmcli/config
      # tap reports a test that skips itself as a pass. The tests of the
      # location rule that need a link (a file outside the project that links
      # to one inside it) skip where links cannot be made, which is not the case
      # on Linux or macOS: there a skip means the test no longer ran, and the
      # run fails. The Windows runner may or may not be allowed to make links.
      - name: The tests that need a link did not skip
        if: runner.os != 'Windows'
        working-directory: npm-cli/workspaces/config
        run: |
          node ../../node_modules/tap/bin/run.js --no-coverage -R tap test/index.js > config-tap.txt 2>&1 || { tail -n 80 config-tap.txt; exit 1; }
          if grep -q '# SKIP' config-tap.txt; then
            echo "tap reports skipped tests; each must have run here:"
            grep -n '# SKIP' config-tap.txt
            exit 1
          fi
          # the check itself: the test it exists for is in the output, and as a pass
          grep -q 'ok [0-9]* - a link from outside the project to a file inside it' config-tap.txt
      - name: Test the npm-cli files the prototype changes
        working-directory: npm-cli
        run: >-
          node node_modules/tap/bin/run.js --no-coverage
          test/lib/utils/token-helper.js test/lib/npm.js
          test/lib/commands/login.js test/lib/commands/logout.js test/lib/commands/publish.js
          test/lib/commands/unpublish.js test/lib/commands/config.js test/lib/commands/profile.js
          test/lib/commands/whoami.js test/lib/utils/oidc.js test/lib/utils/publish-config.js test/lib/utils/error-message.js
      - name: Runner test with deprecations as errors
        if: env.DEPRECATIONS != ''
        working-directory: npm-cli
        run: node $DEPRECATIONS node_modules/tap/bin/run.js --no-coverage test/lib/utils/token-helper.js

      # what a helper printed, read by the runner and by the Python model of
      # Phase 1, and what is logged of what it wrote to stderr
      - name: Helper output against the model, fuzzed
        run: |
          PY=$(command -v python3 || command -v python)
          cd rfc && "$PY" -m tests.fuzz_helper --prototype ../npm-cli --seconds 20 --seed "$GITHUB_RUN_NUMBER"
      # helpers named as awkwardly as the file system allows, run for real
      - name: Helpers with awkward names
        run: node rfc/poc/helper-fuzz/names.js npm-cli

      - name: End to end against a local registry
        run: node rfc/poc/npm-e2e/run.js npm-cli npm-registry-fetch
      - name: Platform probes
        run: node $DEPRECATIONS rfc/poc/platform-probes/run.js npm-cli
      # The same probes on a network share: a helper there is a UNC path,
      # which cmd.exe cannot start in. The runner has admin rights; a step that
      # cannot create its share fails, it never skips.
      - name: Platform probes on an SMB share
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'probe-smb'
          $name = 'probeshare'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          try {
            New-SmbShare -Name $name -Path $dir -FullAccess (whoami) | Out-Null
            $unc = "\\localhost\$name"
            if (-not (Test-Path $unc)) { throw "$unc cannot be reached" }
            $backing = Get-Volume -DriveLetter ($dir.Substring(0, 1))
            Write-Host "probes run on the SMB share $unc, which serves $dir on $($backing.FileSystem)"
            $env:PROBE_ROOT = "$unc\probes"
            $flags = @(); if ($env:DEPRECATIONS) { $flags += $env:DEPRECATIONS }
            node @flags rfc/poc/platform-probes/run.js npm-cli
            if ($LASTEXITCODE -ne 0) { throw "the probes on the SMB share exited with status $LASTEXITCODE" }
          } finally {
            if (Get-SmbShare -Name $name -ErrorAction SilentlyContinue) { Remove-SmbShare -Name $name -Force }
          }
      - name: Every claim's evidence still exists
        run: node rfc/poc/claims/check.js npm-cli npm-registry-fetch

  # every npm/cli suite with the prototype against the same suites without
  # it: the prototype must break nothing outside its own tests
  full-suites:
    name: every npm/cli suite, ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v7
        with:
          path: rfc
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Prepare the base and the patched trees
        run: |
          # names of the same length: Windows path limits apply to both alike
          for tree in base next; do
            git init -q $tree
            (cd $tree &&
              git fetch -q --depth 1 https://github.com/npm/cli.git "$NPM_CLI_BASE" &&
              git checkout -q FETCH_HEAD &&
              node scripts/resetdeps.js &&
              if [ $tree = next ]; then git -c user.name=ci -c user.email=ci@localhost am -q ../rfc/poc/patches/npm-cli.patch; fi)
          done
          # npm itself then runs on the prototype's npm-registry-fetch too
          git init -q npm-registry-fetch
          (cd npm-registry-fetch &&
            git fetch -q --depth 1 https://github.com/npm/npm-registry-fetch.git "$NPM_REGISTRY_FETCH_BASE" &&
            git checkout -q FETCH_HEAD &&
            git -c user.name=ci -c user.email=ci@localhost am -q ../rfc/poc/patches/npm-registry-fetch.patch)
          cp npm-registry-fetch/lib/auth.js npm-registry-fetch/lib/index.js next/node_modules/npm-registry-fetch/lib/
      - name: Every suite, base against prototype
        run: node rfc/poc/full-suites/compare.js base next
