# Runs the Phase 1 tokenHelper prototype on macOS, Linux and Windows: the
# patches in poc/patches are applied to npm/cli and npm/npm-registry-fetch at
# the commits they were made on, and then the prototype's own tests, the
# 2048-combination config check, the end-to-end check against a local
# registry and the platform probes run on each OS.
name: prototype

on:
  push:
    paths:
      - 'poc/**'
      - 'tests/**'
      - 'spec/**'
      - 'sources.md'
      - 'phase-1-implementation.md'
      - 'phase-2-conformance.md'
      - '.github/workflows/prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NPM_CLI_BASE: 83ea1a1c19648a6b4f5e52a498d8a6aaaf60e52b
  NPM_REGISTRY_FETCH_BASE: 6b4159a2519ce5aab26cc4dd8d4596a0b47781d2

jobs:
  prototype:
    name: ${{ matrix.os }}, node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
        # the lowest version of each line npm 12 accepts, and the newest
        node: [22.22.2, 24.15.0, 26.x]
    runs-on: ${{ matrix.os }}
    env:
      # on the newest line a deprecation in the prototype's own code fails the
      # run; set only on the steps that run that code alone
      DEPRECATIONS: ${{ matrix.node == '26.x' && '--throw-deprecation' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      # the patches have LF endings, and lint checks them; npm/cli has test
      # fixtures deeper than the Windows path limit
      - run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v7
        with:
          path: rfc
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: ${{ endsWith(matrix.node, '.x') }}

      - name: Apply the npm-registry-fetch patch
        run: |
          git init -q npm-registry-fetch
          cd npm-registry-fetch
          git fetch -q --depth 1 https://github.com/npm/npm-registry-fetch.git "$NPM_REGISTRY_FETCH_BASE"
          git checkout -q FETCH_HEAD
          git -c user.name=ci -c user.email=ci@localhost am -q ../rfc/poc/patches/npm-registry-fetch.patch
          npm install --ignore-scripts --no-audit --no-fund
      # tests and eslint, without template-oss-check, which compares the repo's
      # git remote and branch with npm's template and has neither here
      - name: Test npm-registry-fetch
        working-directory: npm-registry-fetch
        run: |
          npm test --ignore-scripts
          npm run eslint --ignore-scripts
      # what a helper printed, read by the prototype and by the Python model
      # of Phase 1, and what is logged of what it wrote to stderr
      - name: Helper output against the model, fuzzed
        run: |
          PY=$(command -v python3 || command -v python)
          cd rfc && "$PY" -m tests.fuzz_helper --prototype ../npm-registry-fetch --seconds 20 --seed "$GITHUB_RUN_NUMBER"
      # helpers named as awkwardly as the file system allows, run for real
      - name: Helpers with awkward names
        run: node rfc/poc/helper-fuzz/names.js npm-registry-fetch
      - name: token-helper tests with deprecations as errors
        if: env.DEPRECATIONS != ''
        working-directory: npm-registry-fetch
        run: node $DEPRECATIONS test/token-helper.js

      - name: Apply the npm-cli patch
        run: |
          git init -q npm-cli
          cd npm-cli
          git fetch -q --depth 1 https://github.com/npm/cli.git "$NPM_CLI_BASE"
          git checkout -q FETCH_HEAD
          git -c user.name=ci -c user.email=ci@localhost am -q ../rfc/poc/patches/npm-cli.patch
          node scripts/resetdeps.js
      - name: Test @npmcli/config
        working-directory: npm-cli
        run: node . test --ignore-scripts --workspace @npmcli/config
      - name: Test the npm-cli commands the prototype changes
        working-directory: npm-cli
        run: >-
          node node_modules/tap/bin/run.js --no-coverage
          test/lib/commands/login.js test/lib/commands/logout.js test/lib/commands/publish.js
          test/lib/commands/unpublish.js test/lib/commands/config.js test/lib/commands/profile.js
          test/lib/commands/whoami.js test/lib/utils/oidc.js test/lib/utils/error-message.js
          test/lib/utils/publish-config.js

      - name: Config trust, 2048 combinations
        run: node rfc/poc/npm-config-matrix/run.js npm-cli "$RUNNER_TEMP"
      - name: End to end against a local registry
        run: node rfc/poc/npm-e2e/run.js npm-cli npm-registry-fetch
      - name: tokenHelper spellings from untrusted sources
        run: node rfc/poc/npm-config-fuzz/spellings.js npm-cli npm-registry-fetch "$RUNNER_TEMP" 500 "$GITHUB_RUN_NUMBER"
      - name: Platform probes
        run: node $DEPRECATIONS rfc/poc/platform-probes/run.js npm-cli npm-registry-fetch
      # The same probes on a volume that is not the runner's NTFS temp
      # directory: Windows has filesystems without inode numbers (FAT) and a
      # network share reports another identity again. The runner has admin
      # rights; a step that cannot create its volume fails, it never skips.
      - name: Platform probes on a FAT32 volume
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vhd = Join-Path $env:RUNNER_TEMP 'probe-fat.vhd'
          $letter = 'P'
          $script = Join-Path $env:RUNNER_TEMP 'probe-fat-diskpart.txt'
          $diskpart = {
            param($lines)
            Set-Content -Path $script -Value $lines -Encoding ascii
            diskpart /s $script
            if ($LASTEXITCODE -ne 0) { throw "diskpart exited with status $LASTEXITCODE" }
          }
          try {
            & $diskpart @("create vdisk file=`"$vhd`" maximum=128 type=fixed", "select vdisk file=`"$vhd`"", 'attach vdisk',
              'create partition primary', 'format fs=fat32 quick label=PROBEFAT', "assign letter=$letter")
            $volume = Get-Volume -DriveLetter $letter
            if ($volume.FileSystem -ne 'FAT32') { throw "the volume ${letter}: is $($volume.FileSystem), not FAT32" }
            Write-Host "probes run on ${letter}: $($volume.FileSystem) (label $($volume.FileSystemLabel)), a virtual disk"
            $env:PROBE_ROOT = "${letter}:\probes"
            $flags = @(); if ($env:DEPRECATIONS) { $flags += $env:DEPRECATIONS }
            node @flags rfc/poc/platform-probes/run.js npm-cli npm-registry-fetch
            if ($LASTEXITCODE -ne 0) { throw "the probes on FAT32 exited with status $LASTEXITCODE" }
          } finally {
            if (Test-Path $vhd) { & $diskpart @("select vdisk file=`"$vhd`"", 'detach vdisk') }
          }
      - name: Platform probes on an SMB share
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'probe-smb'
          $name = 'probeshare'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          try {
            New-SmbShare -Name $name -Path $dir -FullAccess (whoami) | Out-Null
            $unc = "\\localhost\$name"
            if (-not (Test-Path $unc)) { throw "$unc cannot be reached" }
            $backing = Get-Volume -DriveLetter ($dir.Substring(0, 1))
            Write-Host "probes run on the SMB share $unc, which serves $dir on $($backing.FileSystem)"
            $env:PROBE_ROOT = "$unc\probes"
            $flags = @(); if ($env:DEPRECATIONS) { $flags += $env:DEPRECATIONS }
            node @flags rfc/poc/platform-probes/run.js npm-cli npm-registry-fetch
            if ($LASTEXITCODE -ne 0) { throw "the probes on the SMB share exited with status $LASTEXITCODE" }
          } finally {
            if (Get-SmbShare -Name $name -ErrorAction SilentlyContinue) { Remove-SmbShare -Name $name -Force }
          }
      - name: Every claim's evidence still exists
        run: node rfc/poc/claims/check.js npm-cli npm-registry-fetch

  # every npm/cli suite with the prototype against the same suites without
  # it: the prototype must break nothing outside its own tests
  full-suites:
    name: every npm/cli suite, ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v7
        with:
          path: rfc
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Prepare the base and the patched trees
        run: |
          # names of the same length: Windows path limits apply to both alike
          for tree in base next; do
            git init -q $tree
            (cd $tree &&
              git fetch -q --depth 1 https://github.com/npm/cli.git "$NPM_CLI_BASE" &&
              git checkout -q FETCH_HEAD &&
              if [ $tree = next ]; then git -c user.name=ci -c user.email=ci@localhost am -q ../rfc/poc/patches/npm-cli.patch; fi &&
              node scripts/resetdeps.js)
          done
          # npm itself then runs on the prototype's npm-registry-fetch too
          git init -q npm-registry-fetch
          (cd npm-registry-fetch &&
            git fetch -q --depth 1 https://github.com/npm/npm-registry-fetch.git "$NPM_REGISTRY_FETCH_BASE" &&
            git checkout -q FETCH_HEAD &&
            git -c user.name=ci -c user.email=ci@localhost am -q ../rfc/poc/patches/npm-registry-fetch.patch)
          cp npm-registry-fetch/lib/auth.js npm-registry-fetch/lib/index.js npm-registry-fetch/lib/token-helper.js next/node_modules/npm-registry-fetch/lib/
      - name: Every suite, base against prototype
        run: node rfc/poc/full-suites/compare.js base next
