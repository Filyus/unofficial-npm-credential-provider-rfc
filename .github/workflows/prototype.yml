# Runs the Phase 1 tokenHelper prototype on macOS, Linux and Windows: the
# patches in poc/patches are applied to npm/cli and npm/npm-registry-fetch at
# the commits they were made on, and then the prototype's own tests, the
# 2048-combination config check, the end-to-end check against a local
# registry and the platform probes run on each OS.
name: prototype

on:
  push:
    paths:
      - 'poc/**'
      - '.github/workflows/prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NPM_CLI_BASE: 83ea1a1c19648a6b4f5e52a498d8a6aaaf60e52b
  NPM_REGISTRY_FETCH_BASE: 6b4159a2519ce5aab26cc4dd8d4596a0b47781d2

jobs:
  prototype:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # the patches have LF endings, and lint checks them
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          path: rfc
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Apply the npm-registry-fetch patch
        run: |
          git init -q npm-registry-fetch
          cd npm-registry-fetch
          git fetch -q --depth 1 https://github.com/npm/npm-registry-fetch.git "$NPM_REGISTRY_FETCH_BASE"
          git checkout -q FETCH_HEAD
          git -c user.name=ci -c user.email=ci@localhost am -q ../rfc/poc/patches/npm-registry-fetch.patch
          npm install --ignore-scripts --no-audit --no-fund
      # tests and eslint, without template-oss-check, which compares the repo's
      # git remote and branch with npm's template and has neither here
      - name: Test npm-registry-fetch
        working-directory: npm-registry-fetch
        run: |
          npm test --ignore-scripts
          npm run eslint --ignore-scripts

      - name: Apply the npm-cli patch
        run: |
          git init -q npm-cli
          cd npm-cli
          git fetch -q --depth 1 https://github.com/npm/cli.git "$NPM_CLI_BASE"
          git checkout -q FETCH_HEAD
          git -c user.name=ci -c user.email=ci@localhost am -q ../rfc/poc/patches/npm-cli.patch
          node scripts/resetdeps.js
      - name: Test @npmcli/config
        working-directory: npm-cli
        run: node . test --ignore-scripts --workspace @npmcli/config
      - name: Test the npm-cli commands the prototype changes
        working-directory: npm-cli
        run: >-
          node node_modules/tap/bin/run.js --no-coverage
          test/lib/commands/login.js test/lib/commands/logout.js test/lib/commands/publish.js
          test/lib/commands/unpublish.js test/lib/commands/config.js test/lib/commands/profile.js
          test/lib/commands/whoami.js test/lib/utils/oidc.js test/lib/utils/error-message.js
          test/lib/utils/publish-config.js

      - name: Config trust, 2048 combinations
        run: node rfc/poc/npm-config-matrix/run.js npm-cli "$RUNNER_TEMP"
      - name: End to end against a local registry
        run: node rfc/poc/npm-e2e/run.js npm-cli npm-registry-fetch
      - name: Platform probes
        run: node rfc/poc/platform-probes/run.js npm-cli npm-registry-fetch
