[package]
name = "credential-provider-protocol-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde = "1"
serde_json = "1"
credential-provider-protocol = { path = "../crates/protocol" }

# not a member of the workspace above it: it needs a nightly toolchain
[workspace]

[[bin]]
name = "message"
path = "fuzz_targets/message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "line_limit"
path = "fuzz_targets/line_limit.rs"
test = false
doc = false
bench = false
