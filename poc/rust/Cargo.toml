[workspace]
members = [
    "crates/protocol",
    "crates/mock-provider",
    "crates/mock-client",
]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
credential-provider-protocol = { path = "crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
